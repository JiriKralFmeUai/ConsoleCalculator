name: Build, Test and Run C# Application

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-test-run:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the project source code
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Set up the .NET SDK environment
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # 3. Restore NuGet packages and dependencies
    - name: Restore dependencies
      run: dotnet restore

    # 4. Build the project in Release configuration
    - name: Build
      run: dotnet build --configuration Release --no-restore

    # 5. Run unit tests
    - name: Run Unit Tests
      run: dotnet test --configuration Release --no-build --verbosity normal

    # 6. Run the application with sample input
    - name: Run Application (Smoke Test)
      run: |
        echo "(8+4.3)*9.07" | dotnet run --project ConsoleCalculator.csproj --no-build --configuration Release
